<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Sharp clean rendering -->
    <style>
      .ck-navy { fill: #0F2B5C; }
      .ck-orange { fill: #F37021; }
      .ck-text {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 64px;
        letter-spacing: -0.5px;
      }
    </style>
  </defs>

  <!-- KINETIC K DUAL-ARROW EMBLEM -->
  <g transform="translate(40, -10)">
    <!-- 1. Navy Vertical Stem -->
    <path class="ck-navy" d="M 180 180 L 214 180 L 214 340 L 180 340 Z" />

    <!-- 2. Navy Upper Arrow (Sweeping upward trajectory) -->
    <!-- Arc from stem up to the main arrowhead -->
    <path class="ck-navy" d="M 190 262 C 220 236 260 196 295 160 L 275 145 L 322 122 L 326 174 L 306 160 C 268 198 232 238 190 262 Z" />

    <!-- 3. Orange Secondary Accent Arrow -->
    <path class="ck-orange" d="M 224 286 C 248 266 280 238 312 210 L 298 198 L 332 186 L 330 222 L 318 212 C 288 238 258 266 224 286 Z" />

    <!-- 4. Navy Lower Leg -->
    <path class="ck-navy" d="M 214 278 L 270 340 L 330 340 L 244 246 Z" />
  </g>

  <!-- BRAND WORDMARK -->
  <text x="300" y="440" text-anchor="middle" class="ck-text">
    <tspan class="ck-navy">Career</tspan><tspan class="ck-orange">K</tspan><tspan class="ck-navy">inetic</tspan>
  </text>
</svg>
